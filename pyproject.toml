[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-sales-coach"
version = "0.1.0"
description = "Local, consent-first coaching for salespeople from authorized call recordings and voice messages: measures audio cues (pauses, pace, pitch/energy, interruptions, laughter, breathing) and drafts replayable, evidence-linked coaching notes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
authors = [{ name = "audio-sales-coach contributors" }]
dependencies = [
  # Exact, tested pins live in requirements/*.lock; these ranges keep `pip install .` working.
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "h5py>=3.10,<4",
  "sherpa-onnx>=1.10,<3",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.0,<2"]
tensorflow-crosscheck = ["tensorflow>=2.16,<2.17", "tf-keras>=2.16,<2.17"]
dev = ["pytest>=8,<10"]

[project.scripts]
audio-sales-coach = "audio_sales_coach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audio_sales_coach = ["data/*.json", "data/*.csv", "data/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "models: needs the downloaded default models (run ./install.sh first; skipped otherwise)",
  "slow: takes more than ~20 s on an Intel laptop CPU",
  "transcription: needs the optional faster-whisper install",
]
